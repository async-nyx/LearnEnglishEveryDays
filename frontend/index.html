<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f8f2f4" />
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('subloop-v1')
          var theme = raw ? (JSON.parse(raw).state || {}).settings?.theme : null
          if (theme !== 'dark' && theme !== 'light') theme = 'light'
          document.documentElement.setAttribute('data-theme', theme)
          document.documentElement.style.background = theme === 'dark' ? '#1a191b' : '#f5f3f4'
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light')
        }
      })()
    </script>
    <title>Subloop — Học tiếng Anh qua video YouTube</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <!--
      Áp theme NGAY, trước khi React chạy. Không có đoạn này thì máy đặt hệ thống nền tối sẽ nháy
      một khung đen rồi mới chuyển sang sáng (USER báo "màn đen rồi mới trắng dần").
    -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
